services:
  postgres:
    image: postgres:16-alpine
    container_name: accesslearn_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: accesslearn
      POSTGRES_PASSWORD: accesslearn_secure_pass
      POSTGRES_DB: accesslearn_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accesslearn -d accesslearn_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: accesslearn_redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: accesslearn_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://accesslearn:accesslearn_secure_pass@postgres:5432/accesslearn_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      JWT_SECRET: super_secret_jwt_signing_key_change_in_production_min_32_chars
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: /app/storage
      MAX_FILE_SIZE_MB: 50
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: accesslearn_worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://accesslearn:accesslearn_secure_pass@postgres:5432/accesslearn_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      JWT_SECRET: super_secret_jwt_signing_key_change_in_production_min_32_chars
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: /app/storage
      MAX_FILE_SIZE_MB: 50
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: accesslearn_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "${FRONTEND_PORT:-3002}:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
