<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} — AccessLearn Accessible Reader</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #111827;
      --accent: #2563eb;
      --border: #e5e7eb;
      --font-size: 18px;
      --line-height: 1.7;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body.dark { --bg: #0f172a; --text: #f8fafc; --border: #334155; }
    body.high-contrast { --bg: #000000; --text: #ffff00; --border: #ffff00; }
    body.sepia { --bg: #fbf0d9; --text: #433422; --border: #d5c4a1; }
    body.dyslexic { font-family: "OpenDyslexic", "Comic Sans MS", sans-serif; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-family);
      font-size: var(--font-size);
      line-height: var(--line-height);
      margin: 0;
      padding: 2rem 1rem;
      transition: all 0.2s ease;
    }
    .container { max-width: 760px; margin: 0 auto; }
    .toolbar {
      position: sticky;
      top: 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 0.5rem 1rem;
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 2rem;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.8rem;
      border-radius: 9999px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    button:hover { opacity: 0.8; }
    .bionic b { font-weight: 800; color: var(--accent); }
    h1, h2, h3 { line-height: 1.3; }
  </style>
</head>
<body>
  <div class="container">
    <header class="toolbar" role="toolbar" aria-label="Reading Controls">
      <button onclick="toggleTheme('dark')">Dark</button>
      <button onclick="toggleTheme('sepia')">Sepia</button>
      <button onclick="toggleTheme('high-contrast')">High Contrast</button>
      <button onclick="toggleDyslexic()">Dyslexic Font</button>
      <button onclick="changeFontSize(2)">A+</button>
      <button onclick="changeFontSize(-2)">A-</button>
      <button onclick="speakText()">Read Aloud</button>
    </header>
    <main id="content">
      <h1>{{ title }}</h1>
      {{ content_html | safe }}
    </main>
  </div>
  <script>
    function toggleTheme(cls) {
      document.body.classList.remove('dark', 'sepia', 'high-contrast');
      if (cls) document.body.classList.add(cls);
    }
    function toggleDyslexic() {
      document.body.classList.toggle('dyslexic');
    }
    function changeFontSize(delta) {
      const root = document.documentElement;
      let cur = parseInt(getComputedStyle(root).getPropertyValue('--font-size')) || 18;
      root.style.setProperty('--font-size', (cur + delta) + 'px');
    }
    function speakText() {
      const text = document.getElementById('content').innerText;
      window.speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      utt.rate = 0.9;
      window.speechSynthesis.speak(utt);
    }
  </script>
</body>
</html>
